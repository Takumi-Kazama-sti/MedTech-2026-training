# volumeでローカルの方がrootユーザーになっているため権限がないため
# UUIDが同じユーザーでありかつnodeイメージに用意されているnodeに権限
# sudo chown -R $(id -u):$(id -g) web   # 先に既存ファイルを自分の所有に
# docker compose up -d web              # web コンテナを作り直す
services:
  # web: React、Next.js、Prisma ORM, 
  web:
    container_name: web-React
    build: ./web
    user: node
    ports:
      - "3000:3000"
    tty: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./web:/app
    depends_on:
      - db
  db:
    container_name: db-PostgreSQL
    build: ./db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-postgre:/var/lib/postgresql/data
      - ./db/sql:/docker-entrypoint-initdb.d
volumes:
  db-postgre:
